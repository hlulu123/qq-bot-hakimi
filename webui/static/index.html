<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>哈基米 Console</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317171a'/%3E%3Cpath d='M17 27 L20 15 L28 21 Q32 20.2 36 21 L44 15 L47 27 Q50 32 49 38 C48 46 41 50 32 50 C23 50 16 46 15 38 Q14 32 17 27 Z' fill='%23ffffff'/%3E%3Ccircle cx='26' cy='35' r='2.4' fill='%2317171a'/%3E%3Ccircle cx='38' cy='35' r='2.4' fill='%2317171a'/%3E%3C/svg%3E"
  />
  <script>
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('hajimi_theme');
        if (saved === 'light' || saved === 'dark') {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app" id="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" id="sidebar-brand" href="#overview" title="返回总览">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.5 13.2 L8.2 6.4 C8.4 5.7 9.2 5.5 9.7 6 L13.6 9.8 Q16 9.3 18.4 9.8 L22.3 6 C22.8 5.5 23.6 5.7 23.8 6.4 L25.5 13.2 C26.7 15.8 26.6 19 25.1 21.6 C23.4 24.6 20.2 26.2 16 26.2 C11.8 26.2 8.6 24.6 6.9 21.6 C5.4 19 5.3 15.8 6.5 13.2 Z" fill="currentColor"/>
            <circle cx="12.2" cy="17.4" r="1.5" fill="var(--brand-eye)"/>
            <circle cx="19.8" cy="17.4" r="1.5" fill="var(--brand-eye)"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">哈基米</span>
          <span class="brand-tag">Console</span>
        </span>
      </a>

      <nav class="nav" id="sidebar-nav"></nav>

      <div class="sidebar-foot">
        <button type="button" class="system-card" id="system-card" title="查看服务状态">
          <div class="system-card-head">
            <span class="status-dot" id="system-dot"></span>
            <span class="system-card-title" id="system-title">正在检测服务…</span>
          </div>
          <div class="system-card-list" id="global-status-pills">
            <div class="system-row" data-service="napcat"><span class="status-dot"></span><span class="system-row-name">NapCat</span><span class="system-row-state">--</span></div>
            <div class="system-row" data-service="ws_guard"><span class="status-dot"></span><span class="system-row-name">ws-guard</span><span class="system-row-state">--</span></div>
            <div class="system-row" data-service="cc_connect"><span class="status-dot"></span><span class="system-row-name">cc-connect</span><span class="system-row-state">--</span></div>
          </div>
        </button>

        <div class="account">
          <span class="account-avatar" id="sidebar-bot-avatar">哈</span>
          <span class="account-text">
            <span class="account-name truncate" id="sidebar-bot-name">哈基米</span>
            <span class="account-meta truncate mono" id="sidebar-bot-uin">--</span>
          </span>
          <a class="icon-btn" id="sidebar-napcat-link" href="http://127.0.0.1:6099/webui/" target="_blank" rel="noopener noreferrer" title="新标签打开 NapCat WebUI"></a>
          <button type="button" class="icon-btn" id="theme-toggle-btn" title="切换浅色 / 深色" aria-label="切换主题"></button>
        </div>
      </div>
    </aside>

    <div class="main" id="main">
      <header class="mobile-bar">
        <button type="button" class="icon-btn" id="mobile-menu-btn" aria-label="打开导航"></button>
        <span class="mobile-bar-title" id="mobile-title">总览</span>
      </header>

      <div class="page" id="page">
        <header class="page-head" id="page-head">
          <div class="page-head-text">
            <div class="page-eyebrow" id="page-eyebrow"></div>
            <h1 class="page-title" id="topbar-title">总览</h1>
            <p class="page-desc" id="topbar-subtitle"></p>
          </div>
          <div class="page-head-actions">
            <div class="page-actions" id="page-actions"></div>
            <button type="button" class="btn btn-secondary btn-icon" id="global-refresh-btn" title="刷新" aria-label="刷新当前页面">
              <span class="refresh-icon-slot" id="global-refresh-icon"></span>
            </button>
          </div>
        </header>

        <main class="page-body" id="app-content" tabindex="-1">
          <div class="stack">
            <div class="loading-skeleton" style="height: 120px;"></div>
            <div class="loading-skeleton" style="height: 280px;"></div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
